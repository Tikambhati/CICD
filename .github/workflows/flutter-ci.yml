
name: Flutter CI Pipeline

on:
  push:
    tags:
      - "v*"

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.6"

jobs:

  # ==========================================
  # JOB 1: CODE QUALITY AND TESTING
  # Runs on PR and version tags
  # ==========================================
  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Check Flutter Version
        run: flutter --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Check Dart Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Flutter Code
        run: flutter analyze

      - name: Run Flutter Tests
        run: flutter test


  # ==========================================
  # JOB 2: ANDROID BUILD AND GITHUB RELEASE
  # Runs only on version tags
  # ==========================================
  android:
    name: Android Build & Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 40

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Check Android Build Environment
        run: |
          flutter --version
          java -version

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Android AAB Artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

      # Publish GitHub Release
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          generate_release_notes: true

      # Send QA Email after successful Release
      - name: Send QA Email
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          QA_EMAIL: ${{ secrets.QA_EMAIL }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
          VERSION: ${{ github.ref_name }}
        run: |
          python3 <<'PY'
          import os
          import smtplib
          from email.message import EmailMessage

          username = os.environ["GMAIL_USERNAME"]
          password = os.environ["GMAIL_APP_PASSWORD"].replace(" ", "")

          recipients = [
              email.strip()
              for email in os.environ["QA_EMAIL"].split(",")
              if email.strip()
          ]

          if not username or not password or not recipients:
              raise RuntimeError("Missing Gmail or QA email configuration")

          version = os.environ["VERSION"]
          release_url = os.environ["RELEASE_URL"]

          msg = EmailMessage()
          msg["Subject"] = f"Android APK Ready for QA - {version}"
          msg["From"] = username
          msg["To"] = ", ".join(recipients)

          msg.set_content(f"""
          Hi QA Team,

          A new Android release is ready for testing.

          Version: {version}
          Platform: Android
          Build Status: Successful

          Download APK and AAB:
          {release_url}

          Please download and start testing.

          Regards,
          Flutter CI Pipeline
          """)

          with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=30) as server:
              server.login(username, password)
              server.send_message(msg)

          print("QA notification email sent successfully.")
          PY


  # ==========================================
  # JOB 3: IOS BUILD
  # Runs only on version tags
  # ==========================================
  ios:
    name: iOS Build
    if: startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: macos-latest
    timeout-minutes: 45

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Check iOS Build Environment
        run: |
          flutter --version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ios-release-app
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 7
