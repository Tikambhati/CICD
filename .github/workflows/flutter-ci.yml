
name: Flutter CI Pipeline

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.6"

jobs:

  # ==========================================
  # JOB 1: CODE QUALITY AND TESTING
  # ==========================================

  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Check Flutter Version
        run: flutter --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Check Dart Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Flutter Code
        run: flutter analyze

      - name: Run Flutter Tests
        run: flutter test


  # ==========================================
  # JOB 2: ANDROID BUILD
  # ==========================================

  android:
    name: Android Build
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Check Android Build Environment
        run: |
          flutter --version
          java -version

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Build Android App Bundle
        run: flutter build appbundle --debug

      - name: Upload Android APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Android AAB
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-debug-aab
          path: build/app/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
          retention-days: 7


  # ==========================================
  # JOB 3: IOS BUILD
  # ==========================================

  ios:
    name: iOS Build
    needs: quality
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Check iOS Build Environment
        run: |
          flutter --version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Upload iOS Build
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ios-release-app
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 7
